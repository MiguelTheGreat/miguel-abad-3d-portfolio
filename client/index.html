<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Miguel Andrei B. Abad — 3D Hot Air Balloon Career e-Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    code, pre, .font-mono {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      background: #eef2f6;
      color: #111111;
    }
    .swiss-grid-bg {
      background-size: 32px 32px;
      background-image:
        linear-gradient(to right, rgba(0, 0, 0, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
    }
    @media print {
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="antialiased selection:bg-[#0047FF] selection:text-white">

  <!-- 3D WebGL Canvas Container -->
  <div id="canvasContainer" class="fixed inset-0 z-0"></div>

  <!-- Minimalist Helvetica HUD Overlay -->
  <div id="hudOverlay" class="fixed inset-0 z-10 pointer-events-none select-none">

    <!-- Top-Left Identity & Mode Controls -->
    <div class="absolute top-4 left-4 flex flex-wrap items-center gap-2 pointer-events-auto">
      <div class="px-3.5 py-2 rounded bg-white/90 backdrop-blur-md border border-black/15 shadow-sm flex items-center gap-2.5">
        <span class="w-2.5 h-2.5 rounded-full bg-[#E63946]"></span>
        <span class="text-xs font-bold tracking-wider uppercase">MIGUEL ABAD // 3D PORTFOLIO</span>
      </div>

      <button id="soundToggleBtn" class="px-3 py-2 rounded bg-white/90 backdrop-blur-md border border-black/15 shadow-sm text-xs font-semibold hover:bg-[#111111] hover:text-white transition-colors">
        🔇 Sound Off
      </button>

      <button id="viewToggleBtn" class="px-3 py-2 rounded bg-white/90 backdrop-blur-md border border-black/15 shadow-sm text-xs font-semibold hover:bg-[#0047FF] hover:text-white transition-colors">
        📄 2D Classic View
      </button>

      <button id="contactQuickBtn" class="px-3 py-2 rounded bg-[#111111] text-white shadow-sm text-xs font-semibold hover:bg-[#0047FF] transition-colors">
        ✉ Contact / Guestbook
      </button>

      <a href="/admin.html" class="px-2.5 py-2 rounded bg-white/80 backdrop-blur-md border border-black/15 text-[11px] font-mono text-neutral-600 hover:text-black">
        Admin
      </a>
    </div>

    <!-- Contextual Zone Entry Prompt -->
    <div class="absolute top-20 left-1/2 -translate-x-1/2 pointer-events-auto">
      <button id="zonePromptBtn" class="hidden px-5 py-2.5 rounded-full bg-[#111111] text-white shadow-xl border border-white/20 text-xs font-bold tracking-wider uppercase flex items-center gap-2.5 hover:bg-[#0047FF] transition-colors">
        <span class="px-1.5 py-0.5 rounded bg-[#E63946] text-[10px] font-mono">ENTER</span>
        <span>Inspect <span id="zonePromptName">Zone</span></span>
      </button>
    </div>

    <!-- Right Side: Minimalist Vertical Altimeter -->
    <div class="absolute right-4 top-1/2 -translate-y-1/2 bg-white/90 backdrop-blur-md border border-black/15 rounded p-2.5 shadow-sm flex flex-col items-center gap-2 w-14">
      <span class="text-[10px] font-mono font-bold tracking-widest text-neutral-500">ALT</span>
      <div class="w-2 h-36 bg-neutral-200 rounded-full relative overflow-hidden flex items-end">
        <div id="altBarFill" class="w-full bg-[#0047FF] rounded-full transition-all duration-75" style="height: 15%"></div>
      </div>
      <span id="altValue" class="text-[11px] font-mono font-bold">5.5m</span>
      <span id="vsValue" class="text-[10px] font-mono text-neutral-500">+0.0</span>
    </div>

    <!-- Bottom-Left: Keycap Hints (Desktop) -->
    <div class="hidden sm:flex absolute bottom-4 left-4 px-3.5 py-2 rounded bg-white/90 backdrop-blur-md border border-black/15 shadow-sm items-center gap-2 text-[11px] font-mono text-neutral-700">
      <span><strong>WASD</strong> Steer</span>
      <span>·</span>
      <span><strong>SPACE</strong> Burn</span>
      <span>·</span>
      <span><strong>SHIFT/C</strong> Vent</span>
      <span>·</span>
      <span><strong>R</strong> Reset</span>
      <span>·</span>
      <span><strong>ENTER</strong> Open</span>
    </div>

    <!-- Bottom-Left: Mobile Virtual Thumbstick -->
    <div id="mobileJoystick" class="sm:hidden absolute bottom-6 left-6 w-24 h-24 rounded-full bg-white/75 backdrop-blur-md border border-black/20 pointer-events-auto flex items-center justify-center touch-none">
      <div id="joystickKnob" class="w-10 h-10 rounded-full bg-[#111111] shadow-md"></div>
    </div>

    <!-- Mobile Burn & Vent Touch Buttons -->
    <div class="sm:hidden absolute bottom-8 right-36 flex flex-col gap-2 pointer-events-auto">
      <button id="mobileBurnBtn" class="px-4 py-2.5 rounded bg-[#E63946] text-white text-xs font-bold uppercase tracking-wider shadow">BURN ▲</button>
      <button id="mobileVentBtn" class="px-4 py-2.5 rounded bg-[#111111] text-white text-xs font-bold uppercase tracking-wider shadow">VENT ▼</button>
    </div>

    <!-- Bottom-Right: Live 2D Radar -->
    <div class="absolute bottom-4 right-4 p-2 rounded bg-white/90 backdrop-blur-md border border-black/15 shadow-sm">
      <div class="flex items-center justify-between text-[9px] font-mono font-bold uppercase tracking-widest text-neutral-500 mb-1 px-1">
        <span>RADAR</span>
        <span>5 ZONES</span>
      </div>
      <canvas id="radarCanvas" width="128" height="128" class="block rounded bg-[#FAFAFA] border border-black/10"></canvas>
    </div>

  </div>

  <!-- 2D Classic View Fallback Container -->
  <div id="classicViewContainer" class="hidden relative z-20"></div>

  <!-- Zone Inspection Drawer / Modal -->
  <div id="zoneDrawer" class="fixed inset-0 z-40 hidden items-center justify-center bg-black/50 backdrop-blur-sm p-4">
    <div class="bg-white border border-black/20 rounded-lg max-w-3xl w-full max-h-[88vh] overflow-y-auto shadow-2xl">
      <div class="sticky top-0 bg-white/95 backdrop-blur-md px-6 py-3.5 border-b border-black/10 flex items-center justify-between">
        <span class="text-[11px] font-mono font-bold uppercase tracking-widest text-neutral-500">Portfolio Inspector</span>
        <button id="closeDrawerBtn" class="px-2.5 py-1 rounded border border-black/20 text-xs font-semibold hover:bg-[#111111] hover:text-white transition-colors">
          ✕ Close [ESC]
        </button>
      </div>
      <div id="zoneDrawerBody" class="p-6 sm:p-8"></div>
    </div>
  </div>

  <!-- Toast Banner -->
  <div id="toastBanner" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-2 rounded bg-[#111111] text-white text-xs font-semibold shadow-lg">
    Copied
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
