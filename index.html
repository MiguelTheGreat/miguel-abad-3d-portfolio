    // Sound Engine
    class SoundEngine {
      constructor() { this.ctx = null; this.muted = true; this.initialized = false; }
      init() {
        if (this.initialized) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        this.ctx = new AudioCtx();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0;
        this.masterGain.connect(this.ctx.destination);
        const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 2, this.ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        const bn = this.ctx.createBufferSource(); bn.buffer = buf; bn.loop = true;
        const bf = this.ctx.createBiquadFilter(); bf.type = 'bandpass'; bf.frequency.value = 340;
        this.burnerGain = this.ctx.createGain(); this.burnerGain.gain.value = 0;
        bn.connect(bf); bf.connect(this.burnerGain); this.burnerGain.connect(this.masterGain); bn.start();
        const wn = this.ctx.createBufferSource(); wn.buffer = buf; wn.loop = true;
        this.windFilter = this.ctx.createBiquadFilter(); this.windFilter.type = 'lowpass'; this.windFilter.frequency.value = 260;
        this.windGain = this.ctx.createGain(); this.windGain.gain.value = 0;
        wn.connect(this.windFilter); this.windFilter.connect(this.windGain); this.windGain.connect(this.masterGain); wn.start();
        this.initialized = true;
      }
      toggleMute() {
        this.init();
        if (!this.ctx) return false;
        if (this.ctx.state === 'suspended') this.ctx.resume();
        this.muted = !this.muted;
        this.masterGain.gain.setTargetAtTime(this.muted ? 0 : 0.65, this.ctx.currentTime, 0.08);
        return !this.muted;
      }
      updateFlightAudio({ isBurning, speed, altitude }) {
        if (!this.initialized || this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        this.burnerGain.gain.setTargetAtTime(isBurning ? 0.34 : 0, now, 0.06);
        this.windGain.gain.setTargetAtTime(0.02 + Math.min(1, speed / 18) * 0.16, now, 0.12);
        this.windFilter.frequency.setTargetAtTime(220 + Math.min(1, speed / 18) * 950 + Math.min(1, altitude / 30) * 200, now, 0.12);
      }
      playZoneChime() {
        if (!this.initialized || this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99].forEach((f, i) => {
          const o = this.ctx.createOscillator(), g = this.ctx.createGain();
          o.frequency.value = f;
          g.gain.setValueAtTime(0.001, now + i * 0.06);
          g.gain.exponentialRampToValueAtTime(0.08, now + i * 0.06 + 0.03);
          g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.06 + 0.45);
          o.connect(g); g.connect(this.masterGain); o.start(now + i * 0.06); o.stop(now + i * 0.06 + 0.48);
        });
      }
      playClick() {
        if (!this.initialized || this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = 'triangle'; o.frequency.setValueAtTime(920, now); o.frequency.exponentialRampToValueAtTime(280, now + 0.045);
        g.gain.setValueAtTime(0.09, now); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
        o.connect(g); g.connect(this.masterGain); o.start(now); o.stop(now + 0.055);
      }
    }

    function createTextPlane(lines, { width = 10, height = 3, accent = '#0047FF', align = 'center' } = {}) {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = Math.round(1024 * (height / width));
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#111111'; ctx.lineWidth = 10; ctx.strokeRect(6, 6, canvas.width - 12, canvas.height - 12);
      ctx.fillStyle = accent; ctx.fillRect(6, 6, canvas.width - 12, 14);
      let y = 80;
      lines.forEach((l) => {
        ctx.fillStyle = l.color || '#111111';
        ctx.font = `${l.weight || 'bold'} ${l.size || 42}px "Helvetica Neue", Helvetica, Arial, sans-serif`;
        ctx.textAlign = align;
        ctx.fillText(l.text, align === 'center' ? canvas.width / 2 : 48, y, canvas.width - 96);
        y += (l.size || 42) + (l.gap || 18);
      });
      const tex = new THREE.CanvasTexture(canvas);
      return new THREE.Mesh(new THREE.PlaneGeometry(width, height), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.45 }));

      { text: '05 // SOUTH LOUNGE', size: 34, color: '#E63946', gap: 16 },
      { text: 'REFERENCES & RECRUITER CONTACT', size: 48, color: '#111111', gap: 18 },
      { text: 'Send Direct Message or Leave a Sky-Guestbook Note', size: 28, weight: 'normal', color: '#595959' }
    ], { width: 11, height: 3.4, accent: '#E63946' });
    southSign.position.set(0, 4.4, 44.5); southSign.rotation.y = Math.PI; scene.add(southSign);

    // Balloon
    const balloonRoot = new THREE.Group();
    const swayGroup = new THREE.Group();
    balloonRoot.add(swayGroup);
    scene.add(balloonRoot);

    const basket = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.85, 1.3), new THREE.MeshStandardMaterial({ color: 0x1c1c1e, roughness: 0.75 }));
    basket.position.y = 0.45; basket.castShadow = true; swayGroup.add(basket);
    const rim = new THREE.Mesh(new THREE.BoxGeometry(1.42, 0.12, 1.42), new THREE.MeshStandardMaterial({ color: 0xe63946 }));
    rim.position.y = 0.9; swayGroup.add(rim);
    const flameMesh = new THREE.Mesh(new THREE.ConeGeometry(0.24, 0.95, 12), new THREE.MeshBasicMaterial({ color: 0xff7b00, transparent: true, opacity: 0 }));
    flameMesh.position.y = 2.48; swayGroup.add(flameMesh);
    const burnerLight = new THREE.PointLight(0xff7722, 0, 14, 1.6);
    burnerLight.position.set(0, 3.6, 0); swayGroup.add(burnerLight);

    const lathePts = [new THREE.Vector2(0.85, 2.85), new THREE.Vector2(1.45, 3.5), new THREE.Vector2(2.25, 4.5), new THREE.Vector2(2.55, 5.5), new THREE.Vector2(2.35, 6.5), new THREE.Vector2(1.7, 7.3), new THREE.Vector2(0.85, 7.8), new THREE.Vector2(0.01, 7.95)];
    const palette = [0xe63946, 0xffffff, 0x111111, 0xffffff];
    for (let i = 0; i < 12; i++) {
      const geo = new THREE.LatheGeometry(lathePts, 4, i * (Math.PI * 2 / 12), (Math.PI * 2 / 12) + 0.004);
      const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: palette[i % 4], side: THREE.DoubleSide, emissive: 0xff5500, emissiveIntensity: 0 }));
      m.castShadow = true; swayGroup.add(m);
    }

    const shadowRing = new THREE.Mesh(new THREE.RingGeometry(1.5, 1.85, 36), new THREE.MeshBasicMaterial({ color: 0xe63946, side: THREE.DoubleSide, transparent: true, opacity: 0.75 }));
    shadowRing.rotation.x = -Math.PI / 2; shadowRing.position.y = 0.08; scene.add(shadowRing);

    const bBody = new CANNON.Body({ mass: 8, shape: new CANNON.Sphere(1.4), position: new CANNON.Vec3(0, 5.5, 14), linearDamping: 0.55, fixedRotation: true });
    world.addBody(bBody);

    // State & UI
    const sound = new SoundEngine();
    const keys = new Set();
    let activeZone = null, isDrawerOpen = false, isClassic = false;
    const touchInput = { x: 0, z: 0, burn: false, vent: false };

    const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function openZone(zoneId) {
      sound.playClick(); isDrawerOpen = true;
      const body = document.getElementById('zoneDrawerBody');
      const p = PORTFOLIO.profile, edu = PORTFOLIO.education[0];
      if (zoneId === 'central') {
        body.innerHTML = `<div class="space-y-4">
          <span class="text-xs font-mono font-bold text-[#E63946]">01 // CENTRAL PLAZA</span>
          <h2 class="text-2xl font-bold">${esc(p.full_name)}</h2>
          <p class="text-sm text-neutral-600">${esc(p.tagline)}</p>
          <p class="text-sm text-neutral-700">${esc(p.summary)}</p>
          <div class="p-4 rounded bg-neutral-50 border border-neutral-200 space-y-2 text-xs">
            <div><strong>Email:</strong> ${esc(p.email)}</div>
            <div><strong>Phone:</strong> ${esc(p.phone)}</div>
            <a href="${esc(p.linkedin_url)}" target="_blank" class="inline-block px-3 py-1.5 rounded bg-[#0047FF] text-white font-semibold">Open LinkedIn ↗</a>
          </div>
          <h3 class="text-xs font-bold uppercase tracking-wider text-neutral-500">Live Sky-Guestbook</h3>
          <div class="space-y-2">${guestbookNotes.map(n => `<div class="p-3 rounded bg-neutral-50 border text-xs"><strong>${esc(n.sender_name)}</strong>: ${esc(n.message)}</div>`).join('')}</div>
        </div>`;
      } else if (zoneId === 'north') {
        body.innerHTML = `<div class="space-y-4">
          <span class="text-xs font-mono font-bold text-[#0047FF]">02 // NORTH PAVILION</span>
          <h2 class="text-2xl font-bold">Resume & Technical Matrix</h2>
          <div class="p-4 rounded bg-neutral-50 border"><strong>${esc(edu.institution)}</strong><br><span class="text-xs text-[#0047FF]">${esc(edu.degree)} (${esc(edu.period)}) · ${esc(edu.honors)}</span></div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${PORTFOLIO.skills.map(s => `<div class="p-3 rounded border text-xs"><strong>${esc(s.category)}</strong><div class="mt-1 flex flex-wrap gap-1">${s.items.map(i => `<span class="px-2 py-0.5 bg-neutral-100 rounded">${esc(i)}</span>`).join('')}</div></div>`).join('')}</div>
        </div>`;
      } else if (zoneId === 'east') {
        body.innerHTML = `<div class="space-y-4">
          <span class="text-xs font-mono font-bold text-[#0047FF]">03 // EAST HARDWARE & AI SKY-LAB</span>
          <h2 class="text-2xl font-bold">Academic Work Samples</h2>
          ${PORTFOLIO.projects.map(pr => `<div class="p-4 rounded border space-y-1.5"><span class="text-[10px] font-mono text-[#0047FF] font-bold">${esc(pr.status)}</span><h3 class="font-bold text-sm">${esc(pr.title)}</h3><p class="text-xs text-neutral-600">${esc(pr.overview)}</p><div class="flex flex-wrap gap-1">${pr.technologies.map(t => `<span class="px-2 py-0.5 bg-neutral-100 rounded text-[11px] font-mono">${esc(t)}</span>`).join('')}</div></div>`).join('')}
        </div>`;
      } else if (zoneId === 'west') {
        body.innerHTML = `<div class="space-y-4">
          <span class="text-xs font-mono font-bold text-[#E63946]">04 // WEST STUDENT HUB</span>
          <h2 class="text-2xl font-bold">ACCESS DLSU — Leadership & Service</h2>
          ${PORTFOLIO.experiences.map(e => `<div class="pl-3 border-l-2 border-[#0047FF]"><h3 class="font-bold text-sm">${esc(e.role)} <span class="text-xs font-mono text-neutral-500">(${esc(e.period)})</span></h3><ul class="list-disc ml-4 text-xs text-neutral-700 mt-1">${e.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul></div>`).join('')}
        </div>`;
      } else {
        body.innerHTML = `<div class="space-y-4">
          <span class="text-xs font-mono font-bold text-[#E63946]">05 // SOUTH LOUNGE</span>
          <h2 class="text-2xl font-bold">References & Guestbook</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${PORTFOLIO.references.map(r => `<div class="p-3 rounded border bg-neutral-50 text-xs"><strong>${esc(r.name)}</strong><p class="text-neutral-600 mt-1">${esc(r.relationship)}</p></div>`).join('')}</div>
          <form id="gbForm" class="p-4 rounded border space-y-2">
            <p class="text-xs font-bold uppercase">Leave a Sky-Guestbook Note</p>
            <input name="name" required placeholder="Your Name" class="w-full px-3 py-1.5 text-xs border rounded" />
            <textarea name="msg" required rows="2" placeholder="Your note..." class="w-full px-3 py-1.5 text-xs border rounded"></textarea>
            <button class="px-4 py-2 rounded bg-[#111111] text-white text-xs font-bold uppercase">Post Note</button>
          </form>
        </div>`;
        body.querySelector('#gbForm').addEventListener('submit', (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          guestbookNotes.unshift({ sender_name: fd.get('name'), message: fd.get('msg'), created_at: 'Today' });
          localStorage.setItem('miguel_guestbook', JSON.stringify(guestbookNotes));
          openZone('central');
        });
      }
      document.getElementById('zoneDrawer').classList.remove('hidden');
      document.getElementById('zoneDrawer').classList.add('flex');
    }

    document.getElementById('closeDrawerBtn').addEventListener('click', () => {
      isDrawerOpen = false;
      document.getElementById('zoneDrawer').classList.add('hidden');
      document.getElementById('zoneDrawer').classList.remove('flex');
    });
    document.getElementById('soundToggleBtn').addEventListener('click', (e) => {
      e.target.textContent = sound.toggleMute() ? '🔊 Sound On' : '🔇 Sound Off';
    });
    document.getElementById('contactQuickBtn').addEventListener('click', () => openZone('south'));
    document.getElementById('zonePromptBtn').addEventListener('click', () => activeZone && openZone(activeZone.id));
    document.getElementById('viewToggleBtn').addEventListener('click', () => {
      isClassic = !isClassic;
      const cv = document.getElementById('classicViewContainer');
      if (isClassic) {
        cv.innerHTML = `<div class="max-w-4xl mx-auto p-8 bg-white min-h-screen space-y-6">
          <div class="flex justify-between items-center border-b pb-4">
            <h1 class="text-2xl font-bold">${esc(PORTFOLIO.profile.full_name)}</h1>
            <button id="back3d" class="px-4 py-2 rounded bg-[#E63946] text-white text-xs font-bold">✈ 3D Flight Mode</button>
          </div>
          <p class="text-sm text-neutral-700">${esc(PORTFOLIO.profile.summary)}</p>
          <h2 class="text-lg font-bold border-b pb-1">Projects</h2>
          ${PORTFOLIO.projects.map(p => `<div class="p-4 border rounded"><h3 class="font-bold">${esc(p.title)}</h3><p class="text-xs text-neutral-600 mt-1">${esc(p.overview)}</p></div>`).join('')}
        </div>`;
        cv.querySelector('#back3d').addEventListener('click', () => document.getElementById('viewToggleBtn').click());
        cv.classList.remove('hidden'); document.getElementById('hudOverlay').classList.add('hidden');
      } else {
        cv.classList.add('hidden'); document.getElementById('hudOverlay').classList.remove('hidden');
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Enter' && activeZone && !isDrawerOpen) openZone(activeZone.id);
      if (e.code === 'KeyR' && !isDrawerOpen) { bBody.position.set(0, 5.5, 14); bBody.velocity.set(0, 0, 0); }
      if (e.code === 'Escape' && isDrawerOpen) document.getElementById('closeDrawerBtn').click();
      keys.add(e.code);
    });
    window.addEventListener('keyup', (e) => keys.delete(e.code));

    const radarCtx = document.getElementById('radarCanvas').getContext('2d');
    const clock = new THREE.Clock();
    const camTarget = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;
      if (!isClassic) {
        world.step(1 / 60, dt, 3);
        let ix = 0, iz = 0;
        if (!isDrawerOpen) {
          if (keys.has('KeyA') || keys.has('ArrowLeft')) ix -= 1;
          if (keys.has('KeyD') || keys.has('ArrowRight')) ix += 1;
          if (keys.has('KeyW') || keys.has('ArrowUp')) iz -= 1;
          if (keys.has('KeyS') || keys.has('ArrowDown')) iz += 1;
        }
        const burn = !isDrawerOpen && (keys.has('Space') || touchInput.burn);
        const vent = !isDrawerOpen && (keys.has('ShiftLeft') || keys.has('ShiftRight') || keys.has('KeyC') || touchInput.vent);
        bBody.applyForce(new CANNON.Vec3(ix * 125 + Math.sin(t * 0.3) * 3, 78.56 + (burn ? 185 : 0) - (vent ? 135 : 0), iz * 125), bBody.position);
        if (bBody.position.y < 1.5) { bBody.position.y = 1.5; bBody.velocity.y = Math.max(0, bBody.velocity.y); }
        if (bBody.position.y > 38) { bBody.position.y = 38; bBody.velocity.y = Math.min(0, bBody.velocity.y); }
        balloonRoot.position.set(bBody.position.x, bBody.position.y - 1.2, bBody.position.z);
        swayGroup.rotation.set(THREE.MathUtils.clamp(bBody.velocity.z * 0.024, -0.24, 0.24), 0, THREE.MathUtils.clamp(-bBody.velocity.x * 0.024, -0.24, 0.24));
        burnerLight.intensity = burn ? 3.2 : 0;
        flameMesh.material.opacity = burn ? 0.9 : 0;
        shadowRing.position.set(bBody.position.x, 0.08, bBody.position.z);
        sound.updateFlightAudio({ isBurning: burn, speed: bBody.velocity.length(), altitude: bBody.position.y });

        camera.position.lerp(new THREE.Vector3(bBody.position.x, bBody.position.y + 7.5, bBody.position.z + 18.5), Math.min(1, dt * 3.8));
        camTarget.lerp(new THREE.Vector3(bBody.position.x, bBody.position.y + 2.8, bBody.position.z), Math.min(1, dt * 5));
        camera.lookAt(camTarget);

        const nearest = ZONES.find(z => Math.hypot(bBody.position.x - z.x, bBody.position.z - z.z) <= z.radius) || null;
        if (nearest?.id !== activeZone?.id) {
          activeZone = nearest;
          const btn = document.getElementById('zonePromptBtn');
          if (nearest) { sound.playZoneChime(); document.getElementById('zonePromptName').textContent = nearest.name; btn.classList.remove('hidden'); }
          else btn.classList.add('hidden');
        }

        document.getElementById('altValue').textContent = `${bBody.position.y.toFixed(1)}m`;
        document.getElementById('vsValue').textContent = `${bBody.velocity.y >= 0 ? '+' : ''}${bBody.velocity.y.toFixed(1)}`;
        document.getElementById('altBarFill').style.height = `${Math.min(100, Math.max(4, (bBody.position.y / 38) * 100))}%`;

        radarCtx.clearRect(0, 0, 128, 128);
        ZONES.forEach(z => { radarCtx.fillStyle = z.color; radarCtx.beginPath(); radarCtx.arc(64 + z.x * 0.8, 64 + z.z * 0.8, 4.5, 0, Math.PI * 2); radarCtx.fill(); });
        radarCtx.fillStyle = '#E63946'; radarCtx.beginPath(); radarCtx.arc(64 + bBody.position.x * 0.8, 64 + bBody.position.z * 0.8, 5.5, 0, Math.PI * 2); radarCtx.fill();

        renderer.render(scene, camera);
      }
    }
    animate();
  </script>
</body>
</html>
