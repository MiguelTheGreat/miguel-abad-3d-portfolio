    const DEFAULT_NOTES = [

    ];
    let guestbookNotes = JSON.parse(localStorage.getItem('miguel_guestbook') || 'null') || DEFAULT_NOTES;

    // Procedural Engine & SFX Audio
    class SoundEngine {
      constructor() { this.ctx = null; this.muted = true; this.initialized = false; }
      init() {
        if (this.initialized) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        this.ctx = new AudioCtx();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0;
        this.masterGain.connect(this.ctx.destination);
        this.engOsc = this.ctx.createOscillator();
        this.engOsc.type = 'sawtooth';
        this.engOsc.frequency.value = 55;
        const engFilter = this.ctx.createBiquadFilter();
        engFilter.type = 'lowpass';
        engFilter.frequency.value = 280;
        this.engGain = this.ctx.createGain();
        this.engGain.gain.value = 0.08;
        this.engOsc.connect(engFilter);
        engFilter.connect(this.engGain);
        this.engGain.connect(this.masterGain);
        this.engOsc.start();
        this.initialized = true;
      }
      toggleMute() {
        this.init();
        if (!this.ctx) return false;
        if (this.ctx.state === 'suspended') this.ctx.resume();
        this.muted = !this.muted;
        this.masterGain.gain.setTargetAtTime(this.muted ? 0 : 0.45, this.ctx.currentTime, 0.08);
        return !this.muted;
      }
      updateEngine(speed, boosting) {
        if (!this.initialized || this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const rpmFreq = 52 + Math.min(140, speed * 3.4) + (boosting ? 35 : 0);
        this.engOsc.frequency.setTargetAtTime(rpmFreq, now, 0.06);
        this.engGain.gain.setTargetAtTime(0.06 + Math.min(0.14, speed * 0.004), now, 0.08);
      }
      playChime() {
        if (!this.initialized || this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99].forEach((f, i) => {
          const o = this.ctx.createOscillator(), g = this.ctx.createGain();
          o.frequency.value = f;
          g.gain.setValueAtTime(0.001, now + i * 0.055);
          g.gain.exponentialRampToValueAtTime(0.09, now + i * 0.055 + 0.025);
          g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.055 + 0.4);
          o.connect(g); g.connect(this.masterGain); o.start(now + i * 0.055); o.stop(now + i * 0.055 + 0.42);
        });
      }
    }

    // Massive Island Zone Coordinates (Spread out across a 360m x 360m island)
    const ZONES = [
      { id: 'central', name: 'Central Plaza', x: 0, z: 0, radius: 17, color: '#E63946' },
      { id: 'north', name: 'North Pavilion', x: -24, z: -112, radius: 18, color: '#0077FF' },
      { id: 'east', name: 'East Hardware & AI Sky-Lab', x: 118, z: -18, radius: 22, color: '#00B4D8' },
      { id: 'west', name: 'West Student Hub', x: -115, z: 22, radius: 18, color: '#FFB703' },
      { id: 'south', name: 'South Lounge', x: 26, z: 114, radius: 18, color: '#FB5607' }
    ];

    function createTextPlane(lines, { width = 12, height = 3.8, accent = '#0077FF', align = 'center' } = {}) {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = Math.round(1024 * (height / width));
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#111111'; ctx.lineWidth = 10; ctx.strokeRect(6, 6, canvas.width - 12, canvas.height - 12);
      ctx.fillStyle = accent; ctx.fillRect(6, 6, canvas.width - 12, 16);
      let y = 84;
      lines.forEach((l) => {
        ctx.fillStyle = l.color || '#111111';
        ctx.font = `${l.weight || 'bold'} ${l.size || 42}px "Helvetica Neue", Helvetica, Arial, sans-serif`;
        ctx.textAlign = align;
        ctx.fillText(l.text, align === 'center' ? canvas.width / 2 : 48, y, canvas.width - 96);
        y += (l.size || 42) + (l.gap || 18);
      });
      return new THREE.Mesh(new THREE.PlaneGeometry(width, height), new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(canvas), roughness: 0.4 }));
    }

    // Build Curved Ribbon Road from CatmullRomCurve3 (NO straight roads!)
    function buildCurvedRoad(scene, points, width = 7.5) {
      const curve = new THREE.CatmullRomCurve3(points.map(([x, z]) => new THREE.Vector3(x, 0.08, z)));
      const divisions = 90;
      const roadPts = curve.getSpacedPoints(divisions);
      const positions = [];
      const indices = [];

      for (let i = 0; i < roadPts.length; i++) {
        const p = roadPts[i];
        const tangent = curve.getTangentAt(i / divisions).normalize();
        const normal = new THREE.Vector3(-tangent.z, 0, tangent.x);
        const left = p.clone().addScaledVector(normal, width / 2);
        const right = p.clone().addScaledVector(normal, -width / 2);
        positions.push(left.x, left.y, left.z, right.x, right.y, right.z);
        if (i < roadPts.length - 1) {
          const a = i * 2, b = i * 2 + 1, c = (i + 1) * 2, d = (i + 1) * 2 + 1;
          indices.push(a, b, c, b, d, c);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      const roadMesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x2b2d42, roughness: 0.85, side: THREE.DoubleSide }));
      roadMesh.receiveShadow = true;
      scene.add(roadMesh);

      // Dashed yellow center markers along curve
      const stripeMat = new THREE.MeshStandardMaterial({ color: 0xffb703, roughness: 0.4 });
      for (let i = 2; i < roadPts.length - 2; i += 4) {
        const p = roadPts[i];
        const tan = curve.getTangentAt(i / divisions);
        const dash = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.05, 2.2), stripeMat);
        dash.position.set(p.x, 0.11, p.z);
        dash.rotation.y = Math.atan2(tan.x, tan.z);
        scene.add(dash);
      }
    }

    // Scene & Renderer (Clean depth separation — ZERO grass Z-fighting!)
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x90e0ef, 130, 380);
    const camera = new THREE.PerspectiveCamera(56, window.innerWidth / window.innerHeight, 0.5, 550);
    const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.getElementById('canvasContainer').appendChild(renderer.domElement);

    // Sunset Sky Dome
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false,
      uniforms: { topColor: { value: new THREE.Color(0x0077b6) }, midColor: { value: new THREE.Color(0x90e0ef) }, bottomColor: { value: new THREE.Color(0xffd166) } },
      vertexShader: `varying vec3 vW; void main(){ vec4 wp = modelMatrix * vec4(position,1.0); vW = wp.xyz; gl_Position = projectionMatrix * viewMatrix * wp; }`,
      fragmentShader: `uniform vec3 topColor; uniform vec3 midColor; uniform vec3 bottomColor; varying vec3 vW; void main(){ float h = normalize(vW).y; vec3 c = mix(bottomColor, midColor, smoothstep(-0.05,0.25,h)); c = mix(c, topColor, smoothstep(0.25,0.85,h)); gl_FragColor = vec4(c,1.0); }`
    });
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(460, 32, 20), skyMat));

    scene.add(new THREE.HemisphereLight(0xffffff, 0x40916c, 0.95));
    const dl = new THREE.DirectionalLight(0xfff4d2, 1.25);
    dl.position.set(90, 120, 70); dl.castShadow = true; dl.shadow.mapSize.set(2048, 2048);
    dl.shadow.camera.left = -190; dl.shadow.camera.right = 190; dl.shadow.camera.top = 190; dl.shadow.camera.bottom = -190;
    scene.add(dl);

    // Physics + Massive Layered Terrain (Strict Y-gaps prevent all Z-fighting!)
    const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -18, 0) });
    const gBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
    gBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
    world.addBody(gBody);

    // Ocean at y = -2.2
    const ocean = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), new THREE.MeshStandardMaterial({ color: 0x0096c7, roughness: 0.25, metalness: 0.15 }));
    ocean.rotation.x = -Math.PI / 2; ocean.position.y = -2.2; scene.add(ocean);

    // Beach top at y = -0.55 (center -1.35, height 1.6)
    const beach = new THREE.Mesh(new THREE.CylinderGeometry(195, 206, 1.6, 72), new THREE.MeshStandardMaterial({ color: 0xf4d58d, roughness: 0.9 }));
    beach.position.y = -1.35; beach.receiveShadow = true; scene.add(beach);

    // Grass top at y = 0.0 (center -0.5, height 1.0)
    const grass = new THREE.Mesh(new THREE.CylinderGeometry(180, 188, 1.0, 72), new THREE.MeshStandardMaterial({ color: 0x52b788, roughness: 0.85 }));
    grass.position.y = -0.5; grass.receiveShadow = true; scene.add(grass);

    // Subtle Grid cleanly above grass at y = 0.04
    const grid = new THREE.GridHelper(340, 68, 0x40916c, 0x40916c);
    grid.position.y = 0.04; grid.material.opacity = 0.2; grid.material.transparent = true; scene.add(grid);

    // Winding Curved S-Bend Roads connecting all 5 zones + Outer Scenic Loop
    buildCurvedRoad(scene, [[0, 0], [18, -32], [-18, -68], [-24, -112]]);
    buildCurvedRoad(scene, [[0, 0], [38, -22], [75, 16], [118, -18]]);
    buildCurvedRoad(scene, [[0, 0], [-36, 28], [-76, -12], [-115, 22]]);
    buildCurvedRoad(scene, [[0, 0], [-22, 38], [26, 72], [26, 114]]);
    // Outer island scenic circuit
    buildCurvedRoad(scene, [[-24, -112], [62, -108], [118, -18], [108, 78], [26, 114], [-68, 102], [-115, 22], [-98, -72], [-24, -112]], 6.0);

    // Lush Forests, Boulders & Clouds across the massive island
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x7f4f24, roughness: 0.9 });
    const pineMat1 = new THREE.MeshStandardMaterial({ color: 0x2d6a4f, roughness: 0.75 });
    const pineMat2 = new THREE.MeshStandardMaterial({ color: 0x40916c, roughness: 0.75 });
    for (let i = 0; i < 65; i++) {
      const angle = (i / 65) * Math.PI * 2 + (i % 3) * 0.2;
      const dist = 34 + ((i * 37) % 135);
      const tx = Math.cos(angle) * dist;
      const tz = Math.sin(angle) * dist;
      if (ZONES.some(z => Math.hypot(tx - z.x, tz - z.z) < z.radius + 7)) continue;
      const t = new THREE.Group();
      const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.5, 2.5, 8), trunkMat); tr.position.y = 1.25; tr.castShadow = true;
      const c1 = new THREE.Mesh(new THREE.ConeGeometry(2.2, 3.6, 8), i % 2 === 0 ? pineMat1 : pineMat2); c1.position.y = 3.5; c1.castShadow = true;
      const c2 = new THREE.Mesh(new THREE.ConeGeometry(1.5, 2.8, 8), pineMat2); c2.position.y = 5.2; c2.castShadow = true;
      t.add(tr, c1, c2); t.scale.setScalar(0.9 + (i % 4) * 0.22); t.position.set(tx, 0, tz); scene.add(t);
    }

    // Collectible Golden Star Rings along the winding roads
    const collectibles = [];
    let ringsCollected = 0;
    [[18, 2.5, -32], [-18, 2.5, -68], [38, 2.5, -22], [75, 2.5, 16], [-36, 2.5, 28], [-76, 2.5, -12], [-22, 2.5, 38], [62, 2.5, -108]].forEach(([x, y, z], idx) => {
      const m = new THREE.Mesh(new THREE.TorusGeometry(2.6, 0.28, 12, 32), new THREE.MeshStandardMaterial({ color: 0xffb703, emissive: 0xfb8500, emissiveIntensity: 0.45, roughness: 0.25, metalness: 0.6 }));
      m.position.set(x, y, z); scene.add(m);
      collectibles.push({ mesh: m, baseY: y, phase: idx, collected: false });
    });

    // Zone Landing Rings & Sky-to-Ground Beacons
    const zoneBeacons = new Map();
    ZONES.forEach((z) => {
      const r = new THREE.Mesh(new THREE.RingGeometry(z.radius - 0.8, z.radius, 52), new THREE.MeshBasicMaterial({ color: z.color, side: THREE.DoubleSide, transparent: true, opacity: 0.7 }));
      r.rotation.x = -Math.PI / 2; r.position.set(z.x, 0.14, z.z); scene.add(r);

      const beam = new THREE.Mesh(
        new THREE.CylinderGeometry(0.45, 1.4, 90, 16, 1, true),
        new THREE.MeshBasicMaterial({ color: z.color, transparent: true, opacity: 0.22, side: THREE.DoubleSide })
      );
      beam.position.set(z.x, 45, z.z);
      scene.add(beam);
      zoneBeacons.set(z.id, beam);
    });

    // Zone Landmarks
    const cPlinth = new THREE.Mesh(new THREE.CylinderGeometry(11, 12, 0.5, 36), new THREE.MeshStandardMaterial({ color: 0xf8f9fa })); cPlinth.position.y = 0.25; scene.add(cPlinth);
    const centralSign = createTextPlane([
      { text: 'MIGUEL ANDREI B. ABAD', size: 66, color: '#111111', gap: 22 },
      { text: 'BS COMPUTER ENGINEERING · DE LA SALLE UNIVERSITY', size: 30, color: '#0077FF', gap: 16 },
      { text: '01 // CENTRAL PLAZA · DRIVE IN TO INSPECT', size: 24, weight: 'normal', color: '#595959' }
    ], { width: 12, height: 3.6, accent: '#E63946' });
    centralSign.position.set(0, 3.0, -7); scene.add(centralSign);

    const northSign = createTextPlane([
      { text: '02 // NORTH PAVILION', size: 34, color: '#0077FF', gap: 18 },
      { text: 'RESUME & TECHNICAL MATRIX', size: 52, color: '#111111', gap: 20 },
      { text: "DLSU Manila · Consistent Dean's Lister", size: 28, weight: 'normal', color: '#595959' }
    ], { width: 12, height: 3.8, accent: '#0077FF' });
    northSign.position.set(-24, 3.6, -120); scene.add(northSign);

    const eastSign = createTextPlane([
      { text: '03 // EAST HARDWARE & AI SKY-LAB', size: 32, color: '#0077FF', gap: 16 },
      { text: 'ACADEMIC WORK SAMPLES', size: 52, color: '#111111', gap: 14 },
      { text: 'FSL Fusion · PIC16F877A PCB · PDF Catalog · SAP-1', size: 26, weight: 'normal', color: '#595959' }
    ], { width: 12.5, height: 3.8, accent: '#00B4D8' });
    eastSign.position.set(126, 3.6, -18); eastSign.rotation.y = -Math.PI / 2; scene.add(eastSign);

    const westSign = createTextPlane([
      { text: '04 // WEST STUDENT HUB', size: 32, color: '#E63946', gap: 16 },
      { text: 'ACCESS DLSU LEADERSHIP', size: 52, color: '#111111', gap: 18 },
      { text: 'AVP for Academics · Junior Officer', size: 28, weight: 'normal', color: '#595959' }
    ], { width: 12, height: 3.8, accent: '#FFB703' });
    westSign.position.set(-123, 3.6, 22); westSign.rotation.y = Math.PI / 2; scene.add(westSign);

    const southSign = createTextPlane([
      { text: '05 // SOUTH LOUNGE', size: 34, color: '#FB5607', gap: 16 },
      { text: 'REFERENCES & RECRUITER CONTACT', size: 46, color: '#111111', gap: 18 },
      { text: 'Leave a Sky-Guestbook Note!', size: 28, weight: 'normal', color: '#595959' }
    ], { width: 12, height: 3.8, accent: '#FB5607' });
    southSign.position.set(26, 3.6, 122); southSign.rotation.y = Math.PI; scene.add(southSign);

    // =========================================================================
    // SWISS RACING CAR (Replaces Balloon!)
    // =========================================================================
    const carGroup = new THREE.Group();
    scene.add(carGroup);

    const chassisMat = new THREE.MeshStandardMaterial({ color: 0xe63946, roughness: 0.3, metalness: 0.35 });
    const stripeCarMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.35 });
    const darkMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5, metalness: 0.2 });
    const glassMat = new THREE.MeshStandardMaterial({ color: 0x1d3557, roughness: 0.15, metalness: 0.6 });

    // Main body
    const bodyLower = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.55, 4.4), chassisMat);
    bodyLower.position.y = 0.55; bodyLower.castShadow = true; carGroup.add(bodyLower);

    // Racing stripe
    const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.57, 4.42), stripeCarMat);
    stripe.position.y = 0.56; carGroup.add(stripe);

    // Cockpit cabin
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.55, 0.52, 2.0), glassMat);
    cabin.position.set(0, 1.02, -0.15); cabin.castShadow = true; carGroup.add(cabin);

    // Rear GT Wing Spoiler
    const wing = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.12, 0.55), darkMat);
    wing.position.set(0, 1.25, 1.95); wing.castShadow = true; carGroup.add(wing);
    [-0.7, 0.7].forEach(wx => {
      const strut = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.45, 0.25), darkMat);
      strut.position.set(wx, 1.0, 1.95); carGroup.add(strut);
    });

    // Headlights & Taillights
    const hlMat = new THREE.MeshBasicMaterial({ color: 0xfff3b0 });
    const tlMat = new THREE.MeshBasicMaterial({ color: 0xff0022 });
    [-0.7, 0.7].forEach(lx => {
      const hl = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.16, 0.08), hlMat); hl.position.set(lx, 0.6, -2.21); carGroup.add(hl);
      const tl = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.16, 0.08), tlMat); tl.position.set(lx, 0.6, 2.21); carGroup.add(tl);
    });

    // 4 Spinning Wheels
    const wheels = [];
    const wGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.34, 18);
    wGeo.rotateZ(Math.PI / 2);
    const wMat = new THREE.MeshStandardMaterial({ color: 0x181818, roughness: 0.8 });
    [[-1.12, 0.42, -1.35], [1.12, 0.42, -1.35], [-1.12, 0.42, 1.35], [1.12, 0.42, 1.35]].forEach(([wx, wy, wz]) => {
      const w = new THREE.Mesh(wGeo, wMat);
      w.position.set(wx, wy, wz); w.castShadow = true; carGroup.add(w);
      wheels.push(w);
    });

    // Nitro Flame Exhausts
    const nitroFlames = [-0.45, 0.45].map(fx => {
      const f = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.9, 10), new THREE.MeshBasicMaterial({ color: 0x00b4d8, transparent: true, opacity: 0 }));
      f.rotation.x = Math.PI / 2; f.position.set(fx, 0.45, 2.55); carGroup.add(f);
      return f;
    });

    // Car Arcade Physics State
    const car = {
      x: 0, z: 16,
      heading: 0,
      speed: 0,
      steerAngle: 0
    };

    // Orbit Camera (Drag to look around, Scroll to zoom)
    const camState = { yawOffset: 0, pitch: 0.28, distance: 15, dragging: false, lastX: 0, lastY: 0 };
    renderer.domElement.addEventListener('pointerdown', (e) => { camState.dragging = true; camState.lastX = e.clientX; camState.lastY = e.clientY; });
    window.addEventListener('pointermove', (e) => {
      if (!camState.dragging) return;
      camState.yawOffset -= (e.clientX - camState.lastX) * 0.006;
      camState.pitch = THREE.MathUtils.clamp(camState.pitch + (e.clientY - camState.lastY) * 0.005, 0.06, 1.05);
      camState.lastX = e.clientX; camState.lastY = e.clientY;
    });
    window.addEventListener('pointerup', () => { camState.dragging = false; });
    renderer.domElement.addEventListener('wheel', (e) => {
      camState.distance = THREE.MathUtils.clamp(camState.distance + e.deltaY * 0.015, 8, 34);
    }, { passive: true });

    // State & Sky-to-Ground Auto Panel
    const sound = new SoundEngine();
    const keys = new Set();
    let activeZone = null, isClassic = false, panelDismissedZoneId = null;
    const touchInput = { steer: 0, throttle: 0, boost: false, brake: false };
    const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function showToast(msg) {
      const t = document.getElementById('toastBanner');
      t.textContent = msg; t.classList.remove('hidden');
      clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.add('hidden'), 2200);
    }

    const skyPanel = document.getElementById('skyDropPanel');
    const skyBody = document.getElementById('skyDropBody');
    const panelDot = document.getElementById('panelZoneDot');
    const panelLabel = document.getElementById('panelZoneLabel');

    function showSkyDropPanel(zone) {
      panelDot.style.backgroundColor = zone.color;
      panelLabel.textContent = zone.name;
      const p = PORTFOLIO.profile, edu = PORTFOLIO.education[0];
      if (zone.id === 'central') {
        skyBody.innerHTML = `<div class="space-y-3">
          <h2 class="text-xl font-bold">${esc(p.full_name)}</h2>
          <p class="text-xs text-neutral-600">${esc(p.tagline)}</p>
          <p class="text-xs text-neutral-700 leading-relaxed">${esc(p.summary)}</p>
          <div class="flex flex-wrap gap-2 text-xs pt-1">
            <span class="px-2.5 py-1 rounded bg-neutral-100 font-mono">${esc(p.email)}</span>
            <span class="px-2.5 py-1 rounded bg-neutral-100 font-mono">${esc(p.phone)}</span>
            <a href="${esc(p.linkedin_url)}" target="_blank" class="px-3 py-1 rounded bg-[#0047FF] text-white font-semibold">LinkedIn ↗</a>
          </div>
          <div class="pt-2 border-t space-y-1.5">${guestbookNotes.slice(0, 3).map(n => `<div class="p-2 rounded bg-neutral-50 border text-xs"><strong>${esc(n.sender_name)}:</strong> ${esc(n.message)}</div>`).join('')}</div>
        </div>`;
      } else if (zone.id === 'north') {
        skyBody.innerHTML = `<div class="space-y-3">
          <h2 class="text-xl font-bold">Resume & Technical Matrix</h2>
          <div class="p-3 rounded bg-neutral-50 border text-xs"><strong>${esc(edu.institution)}</strong> · ${esc(edu.degree)} (${esc(edu.period)}) · <span class="text-[#0047FF] font-semibold">${esc(edu.honors)}</span></div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">${PORTFOLIO.skills.map(s => `<div class="p-2.5 rounded border text-xs"><strong>${esc(s.category)}</strong><div class="mt-1 flex flex-wrap gap-1">${s.items.map(i => `<span class="px-1.5 py-0.5 bg-neutral-100 rounded text-[11px]">${esc(i)}</span>`).join('')}</div></div>`).join('')}</div>
        </div>`;
      } else if (zone.id === 'east') {
        skyBody.innerHTML = `<div class="space-y-3">
          <h2 class="text-xl font-bold">Academic Work Samples</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${PORTFOLIO.projects.map(pr => `<div class="p-3 rounded border space-y-1"><span class="text-[10px] font-mono text-[#0077FF] font-bold">${esc(pr.status)}</span><h3 class="font-bold text-xs">${esc(pr.title)}</h3><p class="text-[11px] text-neutral-600">${esc(pr.overview)}</p><div class="flex flex-wrap gap-1">${pr.technologies.slice(0, 5).map(t => `<span class="px-1.5 py-0.5 bg-neutral-100 rounded text-[10px] font-mono">${esc(t)}</span>`).join('')}</div></div>`).join('')}</div>
        </div>`;
      } else if (zone.id === 'west') {
        skyBody.innerHTML = `<div class="space-y-3">
          <h2 class="text-xl font-bold">ACCESS DLSU — Leadership & Service</h2>
          ${PORTFOLIO.experiences.map(e => `<div class="pl-3 border-l-2 border-[#0047FF]"><h3 class="font-bold text-xs">${esc(e.role)} <span class="font-mono text-neutral-500">(${esc(e.period)})</span></h3><ul class="list-disc ml-4 text-[11px] text-neutral-700 mt-1">${e.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul></div>`).join('')}
        </div>`;
      } else {
        skyBody.innerHTML = `<div class="space-y-3">
          <h2 class="text-xl font-bold">References & Sky-Guestbook</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">${PORTFOLIO.references.map(r => `<div class="p-2.5 rounded border bg-neutral-50 text-xs"><strong>${esc(r.name)}</strong><p class="text-neutral-600 mt-0.5 text-[11px]">${esc(r.relationship)}</p></div>`).join('')}</div>
          <form id="gbForm" class="p-3 rounded border space-y-2">
            <p class="text-xs font-bold uppercase">Leave a Sky-Guestbook Note</p>
            <input name="name" required placeholder="Your Name" class="w-full px-3 py-1.5 text-xs border rounded" />
            <textarea name="msg" required rows="2" placeholder="Your note..." class="w-full px-3 py-1.5 text-xs border rounded"></textarea>
            <button class="px-4 py-1.5 rounded bg-[#111111] text-white text-xs font-bold uppercase">Post Note</button>
          </form>
        </div>`;
        skyBody.querySelector('#gbForm').addEventListener('submit', (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          guestbookNotes.unshift({ sender_name: fd.get('name'), message: fd.get('msg') });
          localStorage.setItem('miguel_guestbook', JSON.stringify(guestbookNotes));
          showToast('Guestbook note posted!');
          showSkyDropPanel(ZONES[0]);
        });
      }
      skyPanel.classList.remove('panel-hidden');
      skyPanel.classList.add('panel-visible');
    }

    function hideSkyDropPanel() {
      skyPanel.classList.remove('panel-visible');
      skyPanel.classList.add('panel-hidden');
    }

    document.getElementById('closePanelBtn').addEventListener('click', () => {
      if (activeZone) panelDismissedZoneId = activeZone.id;
      hideSkyDropPanel();
    });
    document.getElementById('soundToggleBtn').addEventListener('click', (e) => {
      e.target.textContent = sound.toggleMute() ? '🔊 Sound On' : '🔇 Sound Off';
    });
    document.getElementById('contactQuickBtn').addEventListener('click', () => {
      panelDismissedZoneId = null;
      showSkyDropPanel(ZONES[4]);
    });
    document.getElementById('viewToggleBtn').addEventListener('click', () => {
      isClassic = !isClassic;
      const cv = document.getElementById('classicViewContainer');
      if (isClassic) {
        hideSkyDropPanel();
        cv.innerHTML = `<div class="max-w-4xl mx-auto p-8 bg-white min-h-screen space-y-6">
          <div class="flex justify-between items-center border-b pb-4">
            <div><h1 class="text-2xl font-bold">${esc(PORTFOLIO.profile.full_name)}</h1><p class="text-xs text-neutral-500">${esc(PORTFOLIO.profile.email)} · ${esc(PORTFOLIO.profile.phone)}</p></div>
            <button id="back3d" class="px-4 py-2 rounded bg-[#E63946] text-white text-xs font-bold">🏎 3D Grand Prix Mode</button>
          </div>
          <p class="text-sm text-neutral-700">${esc(PORTFOLIO.profile.summary)}</p>
          <h2 class="text-lg font-bold border-b pb-1">Academic Work Samples</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">${PORTFOLIO.projects.map(p => `<div class="p-4 border rounded"><span class="text-[10px] font-mono text-[#0047FF] font-bold">${esc(p.status)}</span><h3 class="font-bold mt-1">${esc(p.title)}</h3><p class="text-xs text-neutral-600 mt-1">${esc(p.overview)}</p></div>`).join('')}</div>
        </div>`;
        cv.querySelector('#back3d').addEventListener('click', () => document.getElementById('viewToggleBtn').click());
        cv.classList.remove('hidden'); document.getElementById('hudOverlay').classList.add('hidden');
      } else {
        cv.classList.add('hidden'); document.getElementById('hudOverlay').classList.remove('hidden');
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.code === 'KeyR') { car.x = 0; car.z = 16; car.speed = 0; car.heading = 0; showToast('Car reset to start'); }
      if (e.code === 'Escape') hideSkyDropPanel();
      keys.add(e.code);
    });
    window.addEventListener('keyup', (e) => keys.delete(e.code));

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const radarCtx = document.getElementById('radarCanvas').getContext('2d');
    const clock = new THREE.Clock();
    const camTarget = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;
      if (!isClassic) {
        const isTyping = document.activeElement?.tagName === 'INPUT' || document.activeElement?.tagName === 'TEXTAREA';
        const fwd = !isTyping && (keys.has('KeyW') || keys.has('ArrowUp'));
        const rev = !isTyping && (keys.has('KeyS') || keys.has('ArrowDown'));
        const left = !isTyping && (keys.has('KeyA') || keys.has('ArrowLeft'));
        const right = !isTyping && (keys.has('KeyD') || keys.has('ArrowRight'));
        const boost = !isTyping && (keys.has('ShiftLeft') || keys.has('ShiftRight') || keys.has('Space') || touchInput.boost);

        const maxSpeed = boost ? 58 : 38;
        const accel = boost ? 62 : 34;
        if (fwd) car.speed += accel * dt;
        else if (rev) car.speed -= 28 * dt;
        else car.speed *= Math.pow(0.22, dt);

        car.speed = THREE.MathUtils.clamp(car.speed, -16, maxSpeed);

        const steerInput = (left ? 1 : 0) - (right ? 1 : 0);
        if (Math.abs(car.speed) > 0.5) {
          const dir = car.speed >= 0 ? 1 : -1;
          car.heading += steerInput * 2.25 * dt * dir;
        }

        car.x -= Math.sin(car.heading) * car.speed * dt;
        car.z -= Math.cos(car.heading) * car.speed * dt;

        // Keep car on massive 180m island
        const rDist = Math.hypot(car.x, car.z);
        if (rDist > 174) {
          const s = 174 / rDist;
          car.x *= s; car.z *= s; car.speed *= 0.5;
        }

        carGroup.position.set(car.x, 0, car.z);
        carGroup.rotation.y = car.heading;
        wheels.forEach(w => { w.rotation.x -= car.speed * dt * 0.9; });
        nitroFlames.forEach(f => { f.material.opacity = boost && Math.abs(car.speed) > 4 ? 0.9 : 0; });

        sound.updateEngine(Math.abs(car.speed), boost);

        // Speedometer HUD
        const kmh = Math.round(Math.abs(car.speed) * 3.2);
        document.getElementById('speedValue').textContent = kmh;
        document.getElementById('speedBarFill').style.height = `${Math.min(100, Math.max(4, (kmh / 185) * 100))}%`;
        document.getElementById('boostStatus').classList.toggle('hidden', !boost);

        // Orbit + Follow Camera behind car
        const camAngle = car.heading + camState.yawOffset;
        const hDist = Math.cos(camState.pitch) * camState.distance;
        const vDist = Math.sin(camState.pitch) * camState.distance;
        const desiredCam = new THREE.Vector3(
          car.x + Math.sin(camAngle) * hDist,
          Math.max(2.2, 2.2 + vDist),
          car.z + Math.cos(camAngle) * hDist
        );
        camera.position.lerp(desiredCam, Math.min(1, dt * 7));
        camTarget.lerp(new THREE.Vector3(car.x, 1.6, car.z), Math.min(1, dt * 9));
        camera.lookAt(camTarget);

        // Collectible Star Rings
        collectibles.forEach(c => {
          c.mesh.rotation.y = t * 1.5 + c.phase;
          if (!c.collected && Math.hypot(car.x - c.mesh.position.x, car.z - c.mesh.position.z) < 4.2) {
            c.collected = true; c.mesh.material.color.setHex(0x52b788); c.mesh.material.emissive.setHex(0x2d6a4f);
            ringsCollected++; document.getElementById('ringScoreBadge').textContent = `★ ${ringsCollected} / 8`;
            sound.playChime(); showToast('★ Gate Cleared!');
          }
        });

        // Automatic Sky-to-Ground Info Drop when entering a zone!
        const nearest = ZONES.find(z => Math.hypot(car.x - z.x, car.z - z.z) <= z.radius) || null;
        if (nearest?.id !== activeZone?.id) {
          activeZone = nearest;
          if (nearest) {
            sound.playChime();
            if (panelDismissedZoneId !== nearest.id) {
              showSkyDropPanel(nearest);
            }
          } else {
            panelDismissedZoneId = null;
            hideSkyDropPanel();
          }
        }

        // Massive Island GPS Radar
        radarCtx.clearRect(0, 0, 136, 136);
        const scale = 136 / 360;
        ZONES.forEach(z => { radarCtx.fillStyle = z.color; radarCtx.beginPath(); radarCtx.arc(68 + z.x * scale, 68 + z.z * scale, 4.5, 0, Math.PI * 2); radarCtx.fill(); });
        radarCtx.fillStyle = '#111111'; radarCtx.beginPath(); radarCtx.arc(68 + car.x * scale, 68 + car.z * scale, 4.5, 0, Math.PI * 2); radarCtx.fill();

        renderer.render(scene, camera);
      }
    }
    animate();
  </script>
</body>
</html>
